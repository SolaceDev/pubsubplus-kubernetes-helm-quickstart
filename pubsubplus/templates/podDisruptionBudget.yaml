# PodDisruptionBudget for  Statefulsets
{{- if .Values.solace.podDisruptionBudgetForHA }}
{{- if .Values.solace.redundancy }}
{{ if $.Capabilities.APIVersions.Has "policy/v1/PodDisruptionBudget" -}}
apiVersion: policy/v1
{{- else -}}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ template "solace.fullname" . }}
  labels:
    {{- include "solace.labels" . | nindent 4 }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "solace.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}